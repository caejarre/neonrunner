<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Clicker Mobile Ultra</title>
<meta name="theme-color" content="#0a0a0f">
<style>
  /* ===== RESET E BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #05050a; color: #eee; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  /* ===== HEADER MOBILE ===== */
  #topbar {
    height: 60px; background: #121220; display: flex; align-items: center; justify-content: space-between;
    padding: 0 15px; border-bottom: 2px solid #222; position: relative; z-index: 10;
  }
  #topScore { font-size: 1.4rem; font-weight: bold; color: #ffd700; }
  #topPPS { font-size: 0.9rem; color: #aaa; }
  #menuBtn { background: #f72585; border: none; color: white; padding: 8px 12px; border-radius: 8px; font-weight: bold; }

  /* ===== AREA CENTRAL ===== */
  #gameArea {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; background: radial-gradient(circle at center, #1a1a2e 0%, #05050a 100%);
  }
  #score { font-size: 2.5rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px #ffd700; margin-bottom: 5px; }
  #pps { font-size: 1rem; color: #90e0ef; margin-bottom: 20px; }

  #botao {
    width: 65vw; height: 65vw; max-width: 300px; max-height: 300px; border-radius: 50%;
    background: radial-gradient(circle, #ff4d6d, #c9184a);
    border: 8px solid #ff758f;
    font-size: 2rem; font-weight: bold; color: white;
    cursor: pointer; transition: all 0.05s;
    box-shadow: 0 0 50px rgba(255,77,109,0.8), inset 0 0 30px rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
  }
  #botao:active { transform: scale(0.88); box-shadow: 0 0 20px rgba(255,77,109,1); }

  #statsRow { display: flex; gap: 15px; margin-top: 20px; font-size: 0.9rem; }
  #multiplier, #crit { background: #1e1e35; padding: 8px 12px; border-radius: 20px; }

  /* ===== BOSS MOBILE ===== */
  #boss { position: absolute; top: 5%; width: 100px; height: 100px; background: radial-gradient(#ff0000,#800000);
    border-radius: 20px; display: none; cursor: pointer; animation: bossFloat 1.5s infinite;
    box-shadow: 0 0 30px rgba(255,0,0,0.7);
  }
  @keyframes bossFloat { 0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-15px) rotate(2deg)} }
  #bossHp { position: absolute; top: -15px; width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  #bossHpBar { height: 100%; background: linear-gradient(90deg,#ff0000,#ff6b6b); transition: width 0.1s; }

  /* ===== MENU LATERAL ===== */
 .sideMenu {
    position: fixed; top: 0; width: 85vw; max-width: 350px; height: 100%; background: #121220;
    transition: transform 0.3s; z-index: 20; overflow-y: auto; padding: 20px;
    border-right: 2px solid #222;
  }
  #menuLeft { left: 0; transform: translateX(-100%); }
  #menuRight { right: 0; transform: translateX(100%); border-left: 2px solid #222; border-right: none; }
 .menuOpen { transform: translateX(0)!important; }
 .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
    display: none; z-index: 15; }
 .overlay.show { display: block; }

  /* ===== COMPONENTES ===== */
 .upgrade,.mission,.achievement,.skin,.event {
    background: #1e1e35; padding: 12px; margin: 8px 0; border-radius: 10px;
    cursor: pointer; border: 1px solid #333; transition: 0.2s;
  }
 .upgrade:active,.skin:active { transform: scale(0.96); }
 .upgrade.locked,.skin.locked { opacity: 0.4; }
 .cost { color: #4cc9f0; font-weight: bold; }
 .owned { color: #90e0ef; font-size: 0.8rem; float: right; }
 .done { opacity: 0.5; }

 .float {
    position: absolute; color: #ffd700; font-weight: bold;
    animation: floatUp 1.2s forwards; pointer-events: none; font-size: 1.4rem;
    text-shadow: 0 0 10px #ffd700;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-150px) scale(1.8); }
  }

  #prestigeBtn, #settingsBtn, #tabBtn {
    margin-top: 10px; padding: 12px; width: 100%;
    background: linear-gradient(90deg, #7209b7, #560bad);
    border: none; border-radius: 10px; color: white; font-weight: bold;
    cursor: pointer; font-size: 1rem;
  }
  #prestigeBtn:disabled { opacity: 0.3; }

 .event { background: linear-gradient(90deg,#ff9f1c,#ffbf69); color: #000; font-weight: bold; text-align: center; }
  h2 { margin: 15px 0 10px 0; color: #f72585; font-size: 1.2rem; border-bottom: 2px solid #f72585; padding-bottom: 5px; }

  /* ===== TABS ===== */
 .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
 .tab { flex: 1; padding: 8px; background: #22223b; border: none; color: #aaa; border-radius: 8px; }
 .tab.active { background: #f72585; color: white; }

  /* ===== RESPONSIVO ===== */
  @media (min-width: 768px) {
    body { flex-direction: row; }
    #topbar { display: none; }
   .sideMenu { position: relative; transform: translateX(0)!important; width: 25%; }
    #gameArea { width: 50%; }
    #botao { width: 280px; height: 280px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div>
    <div id="topScore">0</div>
    <div id="topPPS">0.0/s</div>
  </div>
  <button id="menuBtn" onclick="toggleMenu('right')">MENU</button>
</div>

<div id="gameArea">
  <div id="score">0</div>
  <div id="pps">0.0/s</div>
  <button id="botao" ontouchstart="clickBtn(event)">CLICA</button>
  <div id="boss" ontouchstart="hitBoss(event)"><div id="bossHp"><div id="bossHpBar"></div></div></div>
  <div id="statsRow">
    <div id="multiplier">x1.00</div>
    <div id="crit">Crit:5%</div>
  </div>
  <div id="eventTimer"></div>
</div>

<div class="overlay" id="overlay" onclick="closeMenus()"></div>

<div class="sideMenu" id="menuLeft">
  <h2>Upgrades</h2>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pps')">PPS</button>
    <button class="tab" onclick="switchTab('click')">CLICK</button>
  </div>
  <div id="upgradesPPS"></div>
  <div id="upgradesClick" style="display:none"></div>
  <button id="prestigeBtn" onclick="prestige()">PRESTÍGIO <span id="prestigeReward">0</span>✨</button>
</div>

<div class="sideMenu" id="menuRight">
  <h2>Loja & Progresso</h2>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('skins')">SKINS</button>
    <button class="tab" onclick="switchTab('mis')">MISSÕES</button>
    <button class="tab" onclick="switchTab('ach')">CONQ</button>
  </div>
  <div id="skinsTab"></div>
  <div id="missionsTab" style="display:none"></div>
  <div id="achTab" style="display:none"></div>
  <h2>Ranking</h2>
  <div id="ranking"></div>
  <h2>Stats</h2>
  <div id="stats"></div>
  <button id="settingsBtn" onclick="resetSave()">Resetar Save</button>
</div>

<audio id="clickSound" preload="auto"></audio>
<audio id="critSound" preload="auto"></audio>
<audio id="bossSound" preload="auto"></audio>

<script>
// ===== CONFIG INICIAL E DADOS =====
let game = {
  pontos: 0, pontosPorClique: 1, pontosPorSegundo: 0, multiplicador: 1, critChance: 0.05,
  totalClicado: 0, prestigio: 0, tempoJogado: 0, skinEquipada: 'default', bossesDerrotados: 0,
  upgrades: [
    { id: 'cursor', nome: 'Cursor', baseCost: 15, cost: 15, owned: 0, pps: 0.1, desc: '+0.1/s' },
    { id: 'fazenda', nome: 'Fazenda', baseCost: 100, cost: 100, owned: 0, pps: 1, desc: '+1/s' },
    { id: 'mina', nome: 'Mina', baseCost: 500, cost: 500, owned: 0, pps: 4, desc: '+4/s' },
    { id: 'fabrica', nome: 'Fábrica', baseCost: 1100, cost: 1100, owned: 0, pps: 8, desc: '+8/s' },
    { id: 'banco', nome: 'Banco', baseCost: 12000, cost: 12000, owned: 0, pps: 47, desc: '+47/s' },
    { id: 'laboratorio', nome: 'Laboratório', baseCost: 50000, cost: 50000, owned: 0, pps: 110, desc: '+110/s' },
    { id: 'portal', nome: 'Portal', baseCost: 130000, cost: 130000, owned: 0, pps: 260, desc: '+260/s' },
    { id: 'nave', nome: 'Nave Espacial', baseCost: 500000, cost: 500000, owned: 0, pps: 1000, desc: '+1000/s' },
    { id: 'buraco', nome: 'Buraco Negro', baseCost: 2000000, cost: 2000000, owned: 0, pps: 5000, desc: '+5000/s' },
    { id: 'galaxia', nome: 'Galáxia', baseCost: 10000000, cost: 10000000, owned: 0, pps: 20000, desc: '+20k/s' }
  ],
  upgradesClique: [
    { id: 'dedo', nome: 'Dedo Forte', baseCost: 50, cost: 50, owned: 0, cpp: 1, desc: '+1 por clique' },
    { id: 'luva', nome: 'Luva de Aço', baseCost: 500, cost: 500, owned: 0, cpp: 5, desc: '+5 por clique' },
    { id: 'martelo', nome: 'Martelo', baseCost: 3000, cost: 3000, owned: 0, cpp: 20, desc: '+20 por clique' },
    { id: 'broca', nome: 'Broca', baseCost: 10000, cost: 10000, owned: 0, cpp: 50, desc: '+50 por clique' },
    { id: 'laser', nome: 'Laser', baseCost: 50000, cost: 50000, owned: 0, cpp: 200, desc: '+200 por clique' },
    { id: 'crit', nome: 'Crítico', baseCost: 2000, cost: 2000, owned: 0, crit: 0.05, desc: '+5% chance crítico x3' },
    { id: 'ultra', nome: 'Ultra Click', baseCost: 25000, cost: 25000, owned: 0, crit: 0.1, desc: '+10% crítico' },
    { id: 'mega', nome: 'Mega Crítico', baseCost: 100000, cost: 100000, owned: 0, crit: 0.15, desc: '+15% crítico x5' }
  ],
  missions: [
    { id: 1, nome: 'Primeiros 100', req: 100, reward: 50, done: false },
    { id: 2, nome: '1000 cliques', req: 1000, type: 'clicks', reward: 200, done: false },
    { id: 3, nome: 'Rico', req: 10000, reward: 1000, done: false },
    { id: 4, nome: 'Imparável', req: 100000, reward: 10000, done: false },
    { id: 5, nome: 'Deus do Clique', req: 1000000, reward: 100000, done: false },
    { id: 6, nome: 'Prestigiado', req: 1, type: 'prest', reward: 50000, done: false },
    { id: 7, nome: 'Caçador', req: 10, type: 'boss', reward: 200000, done: false }
  ],
  achievements: [
    { id: 1, nome: 'Iniciante', desc: 'Faça 100 cliques', req: 100, type: 'clicks', done: false, reward: 100 },
    { id: 2, nome: 'Colecionador', desc: 'Compre 20 upgrades', req: 20, type: 'upgrades', done: false, reward: 500 },
    { id: 3, nome: 'Ascendido', desc: 'Alcance 1 Prestígio', req: 1, type: 'prest', done: false, reward: 1000 },
    { id: 4, nome: 'Matador de Boss', desc: 'Derrote 5 bosses', req: 5, type: 'boss', done: false, reward: 2000 },
    { id: 5, nome: 'Milionário', desc: 'Chegue a 1M de pontos', req: 1000000, type: 'points', done: false, reward: 5000 },
    { id: 6, nome: 'Veterano', desc: 'Jogue por 1 hora', req: 3600, type: 'time', done: false, reward: 3000 }
  ],
  skins: [
    { id: 'default', nome: 'Padrão', cost: 0, owned: true, color: 'radial-gradient(circle, #ff4d6d, #c9184a)' },
    { id: 'gold', nome: 'Dourada', cost: 5000, owned: false, color: 'radial-gradient(circle, #ffd700, #ffb700)' },
    { id: 'ice', nome: 'Gelo', cost: 20000, owned: false, color: 'radial-gradient(circle, #90e0ef, #00b4d8)' },
    { id: 'neon', nome: 'Neon', cost: 100000, owned: false, color: 'radial-gradient(circle, #ff00ff, #00ffff)' },
    { id: 'fire', nome: 'Fogo', cost: 500000, owned: false, color: 'radial-gradient(circle, #ff4500, #ff0000)' },
    { id: 'galaxy', nome: 'Galáxia', cost: 2000000, owned: false, color: 'radial-gradient(circle, #7209b7, #3a0ca3)' }
  ],
  boss: { active: false, hp: 0, maxHp: 0, kills: 0 },
  event: { active: false, type: null, timer: 0 },
  settings: { vibration: true, sound: true, autoSave: true }
};

// ===== FUNÇÕES PRINCIPAIS =====
function clickBtn(e) {
  e.preventDefault();
  let ganho = game.pontosPorClique * game.multiplicador * (1 + game.prestigio * 0.1);
  if(game.event.active && game.event.type === '2x') ganho *= 2;
  let isCrit = Math.random() < game.critChance;
  if(isCrit) ganho *= game.upgradesClique.find(u=>u.id==='mega')?.owned? 5 : 3;

  game.pontos += ganho;
  game.totalClicado += 1;

  let touch = e.touches? e.touches[0] : e;
  showFloat(touch.clientX, touch.clientY, `+${Math.floor(ganho)}${isCrit? ' CRIT!' : ''}`);

  if(game.settings.vibration && navigator.vibrate) {
    navigator.vibrate(isCrit? [50,50,50] : 20);
  }
  if(game.settings.sound) playSound(isCrit);
  update();
}

function showFloat(x, y, text) {
  let el = document.createElement('div');
  el.className = 'float';
  el.style.left = (x - 50) + 'px';
  el.style.top = (y - 40) + 'px';
  el.innerText = text;
  document.getElementById('gameArea').appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function playSound(isCrit) {
  // Sons base64 simplificados pra não pesar
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  osc.frequency.value = isCrit? 800 : 400;
  osc.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.1);
}

function buyUpgrade(type, index) {
  let upg = type === 'pps'? game.upgrades[index] : game.upgradesClique[index];
  if(game.pontos >= upg.cost) {
    game.pontos -= upg.cost;
    upg.owned += 1;
    upg.cost = Math.floor(upg.baseCost * Math.pow(1.15, upg.owned));
    if(type === 'pps') game.pontosPorSegundo += upg.pps;
    if(type === 'cpp') game.pontosPorClique += upg.cpp;
    if(type === 'crit') game.critChance += upg.crit;
    update();
  }
}

function buySkin(index) {
  let skin = game.skins[index];
  if(!skin.owned && game.pontos >= skin.cost) {
    game.pontos -= skin.cost;
    skin.owned = true;
  }
  if(skin.owned) {
    game.skinEquipada = skin.id;
    document.getElementById('botao').style.background = skin.color;
  }
  update();
}

function prestige() {
  if(game.pontos < 100000) return;
  let reward = Math.floor(Math.sqrt(game.pontos / 100000));
  if(confirm(`Resetar e ganhar ${reward}✨ de prestígio? +${(reward*10)}% permanente`)){
    game.prestigio += reward;
    game.pontos = 0;
    game.pontosPorClique = 1;
    game.pontosPorSegundo = 0;
    game.critChance = 0.05;
    game.totalClicado = 0;
    game.upgrades.forEach(u => { u.owned = 0; u.cost = u.baseCost; });
    game.upgradesClique.forEach(u => { u.owned = 0; u.cost = u.baseCost; });
    update();
  }
}

function spawnBoss() {
  if(game.boss.active) return;
  game.boss.active = true;
  game.boss.maxHp = 1000 * Math.pow(1.5, game.prestigio);
  game.boss.hp = game.boss.maxHp;
  document.getElementById('boss').style.display = 'block';
  updateBossBar();
  setTimeout(() => { if(game.boss.active) despawnBoss(); }, 20000);
}

function hitBoss(e) {
  if(!game.boss.active) return;
  e.preventDefault();
  let dmg = game.pontosPorClique * 15;
  game.boss.hp -= dmg;
  let touch = e.touches? e.touches[0] : e;
  showFloat(touch.clientX, touch.clientY, `-${Math.floor(dmg)}`);
  if(navigator.vibrate) navigator.vibrate(30);
  updateBossBar();
  if(game.boss.hp <= 0) {
    game.boss.kills += 1;
    game.pontos += game.boss.maxHp * 0.8;
    alert(`Boss derrotado! +${Math.floor(game.boss.maxHp * 0.8)} pontos`);
    despawnBoss();
  }
}

function despawnBoss() {
  game.boss.active = false;
  document.getElementById('boss').style.display = 'none';
}

function updateBossBar() {
  let pct = Math.max(0, (game.boss.hp / game.boss.maxHp) * 100);
  document.getElementById('bossHpBar').style.width = pct + '%';
}

function triggerEvent() {
  if(game.event.active) return;
  game.event.active = true;
  game.event.type = Math.random() < 0.5? '2x' : 'crit';
  game.event.timer = 30;
  let el = document.createElement('div');
  el.className = 'event';
  el.innerText = game.event.type==='2x'?'EVENTO: 2x PONTOS POR 30s!':'EVENTO: 100% CRÍTICO POR 30s!';
  document.getElementById('eventTimer').appendChild(el);
}

function updateEvent() {
  if(game.event.active) {
    game.event.timer -= 1;
    document.getElementById('eventTimer').innerText = `Evento: ${game.event.timer}s`;
    if(game.event.timer <= 0) {
      game.event.active = false;
      game.event.type = null;
      document.getElementById('eventTimer').innerHTML = '';
    }
  }
}

function checkMissions() {
  game.missions.forEach(m => {
    if(!m.done) {
      let progress = m.type === 'clicks'? game.totalClicado : m.type==='prest'?game.prestigio:m.type==='boss'?game.boss.kills:game.pontos;
      if(progress >= m.req) { m.done = true; game.pontos += m.reward; alert(`Missão: ${m.nome}! +${m.reward.toLocaleString('pt-BR')}`); }
    }
  });
}

function checkAchievements() {
  let totalUpgrades = [...game.upgrades,...game.upgradesClique].reduce((a,u)=>a+u.owned,0);
  game.achievements.forEach(a => {
    if(!a.done) {
      let progress = a.type==='clicks'?game.totalClicado:a.type==='upgrades'?totalUpgrades:a.type==='prest'?game.prestigio:a.type==='boss'?game.boss.kills:a.type==='points'?game.pontos:a.type==='time'?game.tempoJogado:0;
      if(progress >= a.req) { a.done = true; game.pontos += a.reward; alert(`Conquista: ${a.nome}! +${a.reward}`); }
    }
  });
}

// ===== RENDER E UI =====
function update() {
  let displayScore = Math.floor(game.pontos).toLocaleString('pt-BR');
  document.getElementById('score').innerText = displayScore;
  document.getElementById('topScore').innerText = displayScore;

  let ppsTotal = game.pontosPorSegundo * (1 + game.prestigio * 0.1);
  if(game.event.active && game.event.type === '2x') ppsTotal *= 2;
  if(game.event.active && game.event.type === 'crit') game.critChance = 1;

  document.getElementById('pps').innerText = `${ppsTotal.toFixed(1)}/s`;
  document.getElementById('topPPS').innerText = `${ppsTotal.toFixed(1)}/s`;
  document.getElementById('multiplier').innerText = `x${(1 + game.prestigio * 0.1).toFixed(2)}`;
  document.getElementById('crit').innerText = `Crit:${(game.critChance*100).toFixed(0)}%`;
  document.getElementById('prestigeReward').innerText = Math.floor(Math.sqrt(game.pontos / 100000));
  document.getElementById('prestigeBtn').disabled = game.pontos < 100000;

  renderUpgrades();
  renderMissions();
  renderAchievements();
  renderSkins();
  renderStats();
  renderRanking();
  checkMissions();
  checkAchievements();
  if(game.settings.autoSave) saveGame();
}

function renderUpgrades() {
  let htmlPPS = '';
  game.upgrades.forEach((u,i) => {
    htmlPPS += `<div class="upgrade ${game.pontos < u.cost? 'locked' : ''}" onclick="buyUpgrade('pps', ${i})">
      <b>${u.nome}</b><span class="owned">${u.owned}</span><br>
      <span>${u.desc}</span><br>
      <span class="cost">${u.cost.toLocaleString('pt-BR')}</span></div>`;
  });
  let htmlClick = '';
  game.upgradesClique.forEach((u,i) => {
    htmlClick += `<div class="upgrade ${game.pontos < u.cost? 'locked' : ''}" onclick="buyUpgrade('cpp', ${i})">
      <b>${u.nome}</b><span class="owned">${u.owned}</span><br>
      <span>${u.desc}</span><br>
      <span class="cost">${u.cost.toLocaleString('pt-BR')}</span></div>`;
  });
  document.getElementById('upgradesPPS').innerHTML = htmlPPS;
  document.getElementById('upgradesClick').innerHTML = htmlClick;
}

function renderMissions() {
  let html = '';
  game.missions.forEach(m => {
    html += `<div class="mission ${m.done?'done':''}"><b>${m.nome}</b> ${m.done?'✅':''}<br>
      Recompensa: <span class="cost">${m.reward.toLocaleString('pt-BR')}</span></div>`;
  });
  document.getElementById('missionsTab').innerHTML = html;
}

function renderAchievements() {
  let html = '';
  game.achievements.forEach(a => {
    html += `<div class="achievement ${a.done?'done':''}"><b>${a.nome}</b> ${a.done?'🏆':''}<br>
      ${a.desc}<br><span class="cost">+${a.reward}</span></div>`;
  });
  document.getElementById('achTab').innerHTML = html;
}

function renderSkins() {
  let html = '';
  game.skins.forEach((s,i) => {
    html += `<div class="skin ${!s.owned && game.pontos < s.cost?'locked':''}" onclick="buySkin(${i})">
      <b>${s.nome}</b> ${game.skinEquipada===s.id?'✔️':''}<br>
      <span class="cost">${s.owned?'Equipado':s.cost===0?'Grátis':s.cost.toLocaleString('pt-BR')}</span></div>`;
  });
  document.getElementById('skinsTab').innerHTML = html;
}

function renderStats() {
  let totalUpgrades = [...game.upgrades,...game.upgradesClique].reduce((a,u)=>a+u.owned,0);
  document.getElementById('stats').innerHTML = `
    Clicks: ${game.totalClicado.toLocaleString('pt-BR')}<br>
    Prestígio: ${game.prestigio}✨<br>
    Bosses: ${game.boss.kills}<br>
    Upgrades: ${totalUpgrades}<br>
    Tempo: ${Math.floor(game.tempoJogado/60)}min
  `;
}

function renderRanking() {
  let ranking = JSON.parse(localStorage.getItem('clickerRanking') || '[]');
  ranking.sort((a,b)=>b.score-a.score);
  let html = '';
  ranking.slice(0,10).forEach((r,i)=>html+=`${i+1}. ${r.score.toLocaleString('pt-BR')}<br>`);
  document.getElementById('ranking').innerHTML = html || 'Sem recordes ainda';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(tab==='pps'){document.getElementById('upgradesPPS').style.display='block';document.getElementById('upgradesClick').style.display='none';}
  if(tab==='click'){document.getElementById('upgradesPPS').style.display='none';document.getElementById('upgradesClick').style.display='block';}
  if(tab==='skins'){document.getElementById('skinsTab').style.display='block';document.getElementById('missionsTab').style.display='none';document.getElementById('achTab').style.display='none';}
  if(tab==='mis'){document.getElementById('skinsTab').style.display='none';document.getElementById('missionsTab').style.display='block';document.getElementById('achTab').style.display='none';}
  if(tab==='ach'){document.getElementById('skinsTab').style.display='none';document.getElementById('missionsTab').style.display='none';document.getElementById('achTab').style.display='block';}
  event.target.classList.add('active');
}

function toggleMenu(side) {
  document.getElementById(side==='left'?'menuLeft':'menuRight').classList.toggle('menuOpen');
  document.getElementById('overlay').classList.toggle('show');
}
function closeMenus() {
  document.querySelectorAll('.sideMenu').forEach(m=>m.classList.remove('menuOpen'));
  document.getElementById('overlay').classList.remove('show');
}

function saveGame() {
  localStorage.setItem('clickerMobile', JSON.stringify(game));
  let ranking = JSON.parse(localStorage.getItem('clickerRanking') || '[]');
  ranking.push({score: Math.floor(game.pontos), date: Date.now()});
  ranking = ranking.slice(-20);
  localStorage.setItem('clickerRanking', JSON.stringify(ranking));
}

function loadGame() {
  let save = localStorage.getItem('clickerMobile');
  if(save) game = {...game,...JSON.parse(save)};
  let skin = game.skins.find(s=>s.id===game.skinEquipada);
  if(skin) document.getElementById('botao').style.background = skin.color;
}

function resetSave() {
  if(confirm("Apagar TUDO?")) {
    localStorage.removeItem('clickerMobile');
    localStorage.removeItem('clickerRanking');
    location.reload();
  }
}

// ===== LOOPS =====
setInterval(() => {
  let bonus = 1;
  if(game.event.active && game.event.type === '2x') bonus = 2;
  game.pontos += game.pontosPorSegundo * (1 + game.prestigio * 0.1) * bonus;
  game.tempoJogado += 1;
  updateEvent();
  update();
}, 1000);

setInterval(() => { if(Math.random() < 0.03) spawnBoss(); }, 8000);
setInterval(() => { if(Math.random() < 0.015) triggerEvent(); }, 15000);

// Anti zoom no mobile
document.addEventListener('gesturestart', e => e.preventDefault());

loadGame();
update();
</script>
</body>
