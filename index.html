<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>Clicker Infinity</title>
<meta name="theme-color" content="#05050a">
<link rel="manifest" href="data:application/json,{">
<style>
  /* ===== SISTEMA DE TEMA ===== */
  :root {
    --bg: #05050a; --bg2: #0f0f1a; --bg3: #1a1a2e; --text: #e0e0ff;
    --accent: #f72585; --accent2: #7209b7; --gold: #ffd700; --blue: #4cc9f0; --green: #06d6a0;
  }
  [data-theme="light"] {
    --bg: #f5f5ff; --bg2: #ffffff; --bg3: #e8e8f0; --text: #1a1a2e;
    --accent: #c9184a; --accent2: #560bad; --gold: #ff8c00; --blue: #0077b6; --green: #04a777;
  }

  /* ===== RESET ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  /* ===== HEADER FLUTUANTE ===== */
  #topbar {
    height: 70px; background: rgba(15,15,26,0.8); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 15px; border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 100;
  }
  #topInfo { display: flex; flex-direction: column; }
  #topScore { font-size: 1.6rem; font-weight: 900; color: var(--gold); letter-spacing: -1px; }
  #topPPS { font-size: 0.9rem; color: var(--blue); }
  #topBtns { display: flex; gap: 8px; }
.iconBtn { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: white; padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(247,37,133,0.3); }
.iconBtn:active { transform: scale(0.92); }

  /* ===== AREA DO JOGO ===== */
  #gameArea {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, var(--bg3) 0%, var(--bg) 70%);
  }
  #score { font-size: 3.2rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 30px var(--gold); margin-bottom: 5px; }
  #pps { font-size: 1.1rem; color: var(--blue); margin-bottom: 25px; font-weight: 600; }

  /* ===== BOTAO PRINCIPAL COM EFEITOS ===== */
  #botao {
    width: 75vw; height: 75vw; max-width: 340px; max-height: 340px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff7b9c, #c9184a);
    border: 12px solid rgba(255,117,143,0.5);
    font-size: 2.4rem; font-weight: 900; color: white;
    cursor: pointer; transition: all 0.08s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 80px rgba(255,77,109,0.6), inset 0 0 50px rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  #botao:active { transform: scale(0.82); filter: brightness(1.3); }
  #botao::before { content: ''; position: absolute; inset: -20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); animation: ripple 2s infinite; }
  @keyframes ripple { 0%{transform:scale(0.8);opacity:1} 100%{transform:scale(1.4);opacity:0} }

  /* ===== STATS BADGES ===== */
  #statsRow { display: flex; gap: 8px; margin-top: 25px; flex-wrap: wrap; justify-content: center; }
.statBadge { background: rgba(26,26,46,0.6); backdrop-filter: blur(10px); padding: 10px 16px; border-radius: 25px; font-size: 0.9rem; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }

  /* ===== BOSS COM HP BAR ===== */
  #boss { position: absolute; top: 10%; width: 120px; height: 120px; background: radial-gradient(circle, #ff3333, #8b0000);
    border-radius: 25px; display: none; cursor: pointer; animation: bossFloat 1s infinite ease-in-out;
    box-shadow: 0 0 50px rgba(255,0,0,0.9); border: 3px solid #ff6666;
  }
  @keyframes bossFloat { 0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-25px) rotate(4deg)} }
  #bossHp { position: absolute; top: -20px; width: 100%; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; }
  #bossHpBar { height: 100%; background: linear-gradient(90deg,#ff0000,#ffaa00); transition: width 0.1s linear; }

  /* ===== MENUS LATERAIS DESLIZANTES ===== */
.sideMenu {
    position: fixed; top: 0; width: 92vw; max-width: 400px; height: 100%; background: var(--bg2);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); z-index: 200; overflow-y: auto; padding: 20px;
    border-right: 1px solid rgba(255,255,255,0.1); box-shadow: 10px 0 50px rgba(0,0,0,0.5);
  }
  #menuLeft { left: 0; transform: translateX(-100%); }
  #menuRight { right: 0; transform: translateX(100%); border-left: 1px solid rgba(255,255,255,0.1); border-right: none; }
.menuOpen { transform: translateX(0)!important; }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
    display: none; z-index: 150; backdrop-filter: blur(5px); }
.overlay.show { display: block; }

  /* ===== CARDS DE UPGRADE ===== */
.upgrade,.mission,.achievement,.skin,.event,.friend {
    background: linear-gradient(135deg, var(--bg3), rgba(26,26,46,0.5));
    padding: 14px; margin: 10px 0; border-radius: 16px;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;
  }
.upgrade:active,.skin:active { transform: scale(0.95); }
.upgrade:hover { border-color: var(--accent); }
.upgrade.locked,.skin.locked { opacity: 0.35; filter: grayscale(0.5); }
.cost { color: var(--blue); font-weight: 800; font-size: 0.95rem; }
.owned { color: var(--gold); font-size: 0.8rem; float: right; font-weight: 700; }
.done { opacity: 0.4; }

  /* ===== FLOATING TEXT ===== */
.float {
    position: absolute; color: var(--gold); font-weight: 900;
    animation: floatUp 1.4s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; font-size: 1.6rem;
    text-shadow: 0 0 20px var(--gold);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-180px) scale(2.2); }
  }

  /* ===== BOTOES ESPECIAIS ===== */
  #prestigeBtn {
    margin-top: 15px; padding: 16px; width: 100%;
    background: linear-gradient(135deg, #7209b7, #560bad);
    border: none; border-radius: 16px; color: white; font-weight: 900;
    cursor: pointer; font-size: 1.1rem; box-shadow: 0 8px 25px rgba(114,9,183,0.4);
  }
  #prestigeBtn:disabled { opacity: 0.3; }

.event { background: linear-gradient(90deg,#ff9f1c,#ffbf69); color: #000; font-weight: 900; text-align: center; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.7} }
  h2 { margin: 20px 0 12px 0; color: var(--accent); font-size: 1.3rem; font-weight: 900; }

  /* ===== TABS ===== */
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tab { flex: 1; padding: 12px; background: var(--bg3); border: none; color: var(--text); border-radius: 12px; font-weight: 700; min-width: 90px; }
.tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }

  /* ===== INPUTS ===== */
input[type="text"] { width:100%;padding:12px;margin:8px 0;background:var(--bg3);border:2px solid rgba(255,255,255,0.1);color:var(--text);border-radius:12px;font-size:1rem; }
input[type="text"]:focus { border-color: var(--accent); outline: none; }

  /* ===== DESKTOP LAYOUT ===== */
  @media (min-width: 900px) {
    body { flex-direction: row; }
    #topbar { display: none; }
 .sideMenu { position: relative; transform: translateX(0)!important; width: 23%; }
    #gameArea { width: 54%; }
    #botao { width: 320px; height: 320px; }
  }
</style>
</head>
<body data-theme="dark">

<div id="topbar">
  <div id="topInfo">
    <div id="topScore">0</div>
    <div id="topPPS">0.0/s</div>
  </div>
  <div id="topBtns">
    <button class="iconBtn" onclick="toggleMenu('left')">⚡ UPG</button>
    <button class="iconBtn" onclick="toggleMenu('right')">📊 MENU</button>
  </div>
</div>

<div id="gameArea">
  <div id="score">0</div>
  <div id="pps">0.0/s</div>
  <button id="botao" ontouchstart="clickBtn(event)">CLICA</button>
  <div id="boss" ontouchstart="hitBoss(event)"><div id="bossHp"><div id="bossHpBar"></div></div></div>
  <div id="statsRow">
    <div class="statBadge" id="multiplier">x1.00</div>
    <div class="statBadge" id="crit">Crit:5%</div>
    <div class="statBadge" id="prestBadge">Prest:0</div>
    <div class="statBadge" id="offline">Offline:0</div>
  </div>
  <div id="eventTimer"></div>
</div>

<div class="overlay" id="overlay" onclick="closeMenus()"></div>

<div class="sideMenu" id="menuLeft">
  <h2>⚡ Upgrades</h2>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pps')">PPS</button>
    <button class="tab" onclick="switchTab('click')">CLICK</button>
  </div>
  <div id="upgradesPPS"></div>
  <div id="upgradesClick" style="display:none"></div>
  <button id="prestigeBtn" onclick="prestige()">🌟 PRESTÍGIO <span id="prestigeReward">0</span>✨</button>
</div>

<div class="sideMenu" id="menuRight">
  <h2>📊 Progresso</h2>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('skins')">SKINS</button>
    <button class="tab" onclick="switchTab('mis')">MISSÕES</button>
    <button class="tab" onclick="switchTab('ach')">CONQ</button>
  </div>
  <div id="skinsTab"></div>
  <div id="missionsTab" style="display:none"></div>
  <div id="achTab" style="display:none"></div>

  <h2>👥 Amigos</h2>
  <div id="friendsTab">
    <input type="text" id="friendName" placeholder="Nome do amigo">
    <button class="iconBtn" style="width:100%" onclick="addFriend()">+ Adicionar Amigo</button>
    <div id="friendsList"></div>
  </div>

  <h2>⚙️ Configurações</h2>
  <button class="iconBtn" style="width:100%;margin:5px 0" id="themeBtn" onclick="toggleTheme()">Tema: Escuro</button>
  <button class="iconBtn" style="width:100%;margin:5px 0;background:var(--green)" onclick="exportSave()">📤 Exportar Save</button>
  <button class="iconBtn" style="width:100%;margin:5px 0;background:var(--blue)" onclick="importSave()">📥 Importar Save</button>
  <label><input type="checkbox" id="vibToggle" checked onchange="toggleSetting('vibration')"> Vibração</label><br>
  <label><input type="checkbox" id="soundToggle" checked onchange="toggleSetting('sound')"> Som</label><br>
  <label><input type="checkbox" id="autoSaveToggle" checked onchange="toggleSetting('autoSave')"> Auto Save</label>

  <h2>🏆 Ranking</h2>
  <div id="ranking"></div>
  <h2>📈 Estatísticas</h2>
  <div id="stats"></div>
  <button class="iconBtn" style="width:100%;margin-top:10px;background:#c9184a" onclick="resetSave()">🗑️ Resetar TUDO</button>
</div>

<script>
// ===== ESTADO COMPLETO DO JOGO =====
let game = {
  pontos: 0, pontosPorClique: 1, pontosPorSegundo: 0, multiplicador: 1, critChance: 0.05,
  totalClicado: 0, prestigio: 0, tempoJogado: 0, ultimoLogin: Date.now(), skinEquipada: 'default',
  bossesDerrotados: 0, nomeJogador: 'Player' + Math.floor(Math.random()*9999),
  amigos: [], conquistasDesbloqueadas: 0,

  upgrades: [
    { id: 'cursor', nome: 'Cursor', baseCost: 15, cost: 15, owned: 0, pps: 0.1, desc: '+0.1/s' },
    { id: 'fazenda', nome: 'Fazenda', baseCost: 100, cost: 100, owned: 0, pps: 1, desc: '+1/s' },
    { id: 'mina', nome: 'Mina', baseCost: 500, cost: 500, owned: 0, pps: 4, desc: '+4/s' },
    { id: 'fabrica', nome: 'Fábrica', baseCost: 1100, cost: 1100, owned: 0, pps: 8, desc: '+8/s' },
    { id: 'banco', nome: 'Banco', baseCost: 12000, cost: 12000, owned: 0, pps: 47, desc: '+47/s' },
    { id: 'laboratorio', nome: 'Laboratório', baseCost: 50000, cost: 50000, owned: 0, pps: 110, desc: '+110/s' },
    { id: 'portal', nome: 'Portal', baseCost: 130000, cost: 130000, owned: 0, pps: 260, desc: '+260/s' },
    { id: 'nave', nome: 'Nave Espacial', baseCost: 500000, cost: 500000, owned: 0, pps: 1000, desc: '+1000/s' },
    { id: 'buraco', nome: 'Buraco Negro', baseCost: 2000000, cost: 2000000, owned: 0, pps: 5000, desc: '+5000/s' },
    { id: 'galaxia', nome: 'Galáxia', baseCost: 10000000, cost: 10000000, owned: 0, pps: 20000, desc: '+20k/s' },
    { id: 'universo', nome: 'Universo', baseCost: 50000000, cost: 50000000, owned: 0, pps: 100000, desc: '+100k/s' },
    { id: 'multiverso', nome: 'Multiverso', baseCost: 250000000, cost: 250000000, owned: 0, pps: 500000, desc: '+500k/s' }
  ],

  upgradesClique: [
    { id: 'dedo', nome: 'Dedo Forte', baseCost: 50, cost: 50, owned: 0, cpp: 1, desc: '+1 por clique' },
    { id: 'luva', nome: 'Luva de Aço', baseCost: 500, cost: 500, owned: 0, cpp: 5, desc: '+5 por clique' },
    { id: 'martelo', nome: 'Martelo', baseCost: 3000, cost: 3000, owned: 0, cpp: 20, desc: '+20 por clique' },
    { id: 'broca', nome: 'Broca', baseCost: 10000, cost: 10000, owned: 0, cpp: 50, desc: '+50 por clique' },
    { id: 'laser', nome: 'Laser', baseCost: 50000, cost: 50000, owned: 0, cpp: 200, desc: '+200 por clique' },
    { id: 'plasma', nome: 'Canhão de Plasma', baseCost: 250000, cost: 250000, owned: 0, cpp: 1000, desc: '+1000 por clique' },
    { id: 'crit', nome: 'Crítico', baseCost: 2000, cost: 2000, owned: 0, crit: 0.05, desc: '+5% chance crítico x3' },
    { id: 'ultra', nome: 'Ultra Click', baseCost: 25000, cost: 25000, owned: 0, crit: 0.1, desc: '+10% crítico' },
    { id: 'mega', nome: 'Mega Crítico', baseCost: 100000, cost: 100000, owned: 0, crit: 0.15, desc: '+15% crítico x5' },
    { id: 'god', nome: 'God Click', baseCost: 1000000, cost: 1000000, owned: 0, crit: 0.2, desc: '+20% crítico x10' }
  ],

  missions: [
    { id: 1, nome: 'Primeiros 100', req: 100, reward: 50, done: false },
    { id: 2, nome: '1000 cliques', req: 1000, type: 'clicks', reward: 200, done: false },
    { id: 3, nome: 'Rico', req: 10000, reward: 1000, done: false },
    { id: 4, nome: 'Imparável', req: 100000, reward: 10000, done: false },
    { id: 5, nome: 'Deus do Clique', req: 1000000, reward: 100000, done: false },
    { id: 6, nome: 'Prestigiado', req: 1, type: 'prest', reward: 50000, done: false },
    { id: 7, nome: 'Caçador', req: 10, type: 'boss', reward: 200000, done: false },
    { id: 8, nome: 'Bilionario', req: 100000, reward: 1000000, done: false }
  ],

  achievements: [
    { id: 1, nome: 'Iniciante', desc: 'Faça 100 cliques', req: 100, type: 'clicks', done: false, reward: 100 },
    { id: 2, nome: 'Colecionador', desc: 'Compre 40 upgrades', req: 40, type: 'upgrades', done: false, reward: 1000 },
    { id: 3, nome: 'Ascendido', desc: 'Alcance 10 Prestígio', req: 10, type: 'prest', done: false, reward: 100000 },
    { id: 4, nome: 'Matador de Boss', desc: 'Derrote 50 bosses', req: 50, type: 'boss', done: false, reward: 50000 },
    { id: 5, nome: 'Milionário', desc: 'Chegue a 10M de pontos', req: 10000000, type: 'points', done: false, reward: 200000 },
    { id: 6, nome: 'Veterano', desc: 'Jogue por 24 horas', req: 86400, type: 'time', done: false, reward: 100000 },
    { id: 7, nome: 'Social', desc: 'Adicione 5 amigos', req: 5, type: 'friends', done: false, reward: 50000 }
  ],

  skins: [
    { id: 'default', nome: 'Padrão', cost: 0, owned: true, color: 'radial-gradient(circle at 30% 30%, #ff7b9c, #c9184a)' },
    { id: 'gold', nome: 'Dourada', cost: 5000, owned: false, color: 'radial-gradient(circle at 30% 30%, #ffd700, #ffb700)' },
    { id: 'ice', nome: 'Gelo', cost: 20000, owned: false, color: 'radial-gradient(circle at 30% 30%, #90e0ef, #00b4d8)' },
    { id: 'neon', nome: 'Neon', cost: 100000, owned: false, color: 'radial-gradient(circle at 30% 30%, #ff00ff, #00ffff)' },
    { id: 'fire', nome: 'Fogo', cost: 500000, owned: false, color: 'radial-gradient(circle at 30% 30%, #ff4500, #ff0000)' },
    { id: 'galaxy', nome: 'Galáxia', cost: 2000000, owned: false, color: 'radial-gradient(circle at 30% 30%, #7209b7, #3a0ca3)' },
    { id: 'matrix', nome: 'Matrix', cost: 10000000, owned: false, color: 'radial-gradient(circle at 30% 30%, #00ff00, #008000)' },
    { id: 'rainbow', nome: 'Arco-íris', cost: 50000000, owned: false, color: 'conic-gradient(red, orange, yellow, green, blue, indigo, violet, red)' }
  ],

  boss: { active: false, hp: 0, maxHp: 0, kills: 0 },
  event: { active: false, type: null, timer: 0 },
  settings: { vibration: true, sound: true, autoSave: true, theme: 'dark' }
};

// ===== MECÂNICAS PRINCIPAIS =====
function clickBtn(e) {
  e.preventDefault();
  let ganho = game.pontosPorClique * game.multiplicador * (1 + game.prestigio * 0.1);
  if(game.event.active && game.event.type === '2x') ganho *= 2;
  let isCrit = Math.random() < game.critChance;
  let critMult = game.upgradesClique.find(u=>u.id==='god')?.owned? 10 : game.upgradesClique.find(u=>u.id==='mega')?.owned? 5 : 3;
  if(isCrit) ganho *= critMult;

  game.pontos += ganho; game.totalClicado += 1;
  let touch = e.touches? e.touches[0] : e;
  showFloat(touch.clientX, touch.clientY, `+${formatNum(ganho)}${isCrit? ` ${critMult}x!` : ''}`);
  if(game.settings.vibration && navigator.vibrate) navigator.vibrate(isCrit? [40,40,40] : 20);
  if(game.settings.sound) playSound(isCrit);
  update();
}

function showFloat(x, y, text) {
  let el = document.createElement('div'); el.className = 'float';
  el.style.left = (x - 70) + 'px'; el.style.top = (y - 60) + 'px'; el.innerText = text;
  document.getElementById('gameArea').appendChild(el); setTimeout(() => el.remove(), 1400);
}

function playSound(isCrit) {
  try {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator(); let gain = ctx.createGain();
    osc.frequency.value = isCrit? 1500 : 600; gain.gain.value = 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.07);
  } catch(e){}
}

function formatNum(num) {
  if(num >= 1e12) return (num/1e12).toFixed(2) + 'T';
  if(num >= 1e9) return (num/1e9).toFixed(2) + 'B';
  if(num >= 1e6) return (num/1e6).toFixed(2) + 'M';
  if(num >= 1e3) return (num/1e3).toFixed(2) + 'K';
  return Math.floor(num).toLocaleString('pt-BR');
}

function buyUpgrade(type, index) {
  let upg = type === 'pps'? game.upgrades[index] : game.upgradesClique[index];
  if(game.pontos >= upg.cost) {
    game.pontos -= upg.cost; upg.owned += 1;
    upg.cost = Math.floor(upg.baseCost * Math.pow(1.16, upg.owned));
    if(type === 'pps') game.pontosPorSegundo += upg.pps;
    if(type === 'cpp') game.pontosPorClique += upg.cpp;
    if(type === 'crit') game.critChance += upg.crit;
    update();
  }
}

function buySkin(index) {
  let skin = game.skins[index];
  if(!skin.owned && game.pontos >= skin.cost) { game.pontos -= skin.cost; skin.owned = true; }
  if(skin.owned) { game.skinEquipada = skin.id; document.getElementById('botao').style.background = skin.color; }
  update();
}

function prestige() {
  if(game.pontos < 100000) return;
  let reward = Math.floor(Math.sqrt(game.pontos / 100000));
  if(confirm(`Resetar e ganhar ${reward}✨ de prestígio? +${(reward*10)}% permanente`)){
    game.prestigio += reward; game.pontos = 0; game.pontosPorClique = 1; game.pontosPorSegundo = 0;
    game.critChance = 0.05; game.totalClicado = 0;
    game.upgrades.forEach(u => { u.owned = 0; u.cost = u.baseCost; });
    game.upgradesClique.forEach(u => { u.owned = 0; u.cost = u.baseCost; });
    update();
  }
}

// ===== BOSS SYSTEM =====
function spawnBoss() {
  if(game.boss.active) return;
  game.boss.active = true;
  game.boss.maxHp = 5000 * Math.pow(2, game.prestigio);
  game.boss.hp = game.boss.maxHp;
  document.getElementById('boss').style.display = 'block';
  updateBossBar();
  setTimeout(() => { if(game.boss.active) despawnBoss(); }, 30000);
}

function hitBoss(e) {
  if(!game.boss.active) return; e.preventDefault();
  let dmg = game.pontosPorClique * 25;
  game.boss.hp -= dmg;
  let touch = e.touches? e.touches[0] : e;
  showFloat(touch.clientX, touch.clientY, `-${formatNum(dmg)}`);
  if(navigator.vibrate) navigator.vibrate(50);
  updateBossBar();
  if(game.boss.hp <= 0) {
    game.boss.kills += 1; game.pontos += game.boss.maxHp * 1.5;
    alert(`BOSS LENDÁRIO DERROTADO! +${formatNum(game.boss.maxHp * 1.5)}`);
    despawnBoss();
  }
}

function despawnBoss() { game.boss.active = false; document.getElementById('boss').style.display = 'none'; }
function updateBossBar() { let pct = Math.max(0, (game.boss.hp / game.boss.maxHp) * 100); document.getElementById('bossHpBar').style.width = pct + '%'; }

// ===== EVENTOS ALEATORIOS =====
function triggerEvent() {
  if(game.event.active) return;
  game.event.active = true;
  game.event.type = ['2x','crit','auto','mega'][Math.floor(Math.random()*4)];
  game.event.timer = 60;
  let txt = { '2x':'2X PONTOS', 'crit':'100% CRÍTICO', 'auto':'AUTO CLICK', 'mega':'MEGA LOOT' }[game.event.type];
  let el = document.createElement('div'); el.className = 'event'; el.innerText = `🔥 EVENTO: ${txt} 60s 🔥`;
  document.getElementById('eventTimer').appendChild(el);
}

function updateEvent() {
  if(game.event.active) {
    game.event.timer -= 1;
    document.getElementById('eventTimer').innerText = `Evento: ${game.event.timer}s`;
    if(game.event.timer <= 0) {
      game.event.active = false; game.event.type = null;
      document.getElementById('eventTimer').innerHTML = '';
    }
  }
}

// ===== SISTEMA DE AMIGOS =====
function addFriend() {
  let name = document.getElementById('friendName').value.trim();
  if(name &&!game.amigos.find(f=>f.nome===name)) {
    game.amigos.push({nome: name, score: Math.floor(Math.random()*5000000)});
    document.getElementById('friendName').value = '';
    update();
  }
}

function compareFriend(index) {
  let amigo = game.amigos[index];
  alert(`${amigo.nome}: ${formatNum(amigo.score)}\nVocê: ${formatNum(game.pontos)}\nDiferença: ${formatNum(Math.abs(amigo.score - game.pontos))}`);
}

// ===== MISSÕES E CONQUISTAS =====
function checkMissions() {
  game.missions.forEach(m => {
    if(!m.done) {
      let progress = m.type === 'clicks'? game.totalClicado : m.type==='prest'?game.prestigio:m.type==='boss'?game.boss.kills:game.pontos;
      if(progress >= m.req) { m.done = true; game.pontos += m.reward; alert(`✅ Missão: ${m.nome}! +${formatNum(m.reward)}`); }
    }
  });
}

function checkAchievements() {
  let totalUpgrades = [...game.upgrades,...game.upgradesClique].reduce((a,u)=>a+u.owned,0);
  game.achievements.forEach(a => {
    if(!a.done) {
      let progress = a.type==='clicks'?game.totalClicado:a.type==='upgrades'?totalUpgrades:a.type==='prest'?game.prestigio:a.type==='boss'?game.boss.kills:a.type==='points'?game.pontos:a.type==='time'?game.tempoJogado:a.type==='friends'?game.amigos.length:0;
      if(progress >= a.req) { a.done = true; game.conquistasDesbloqueadas++; game.pontos += a.reward; alert(`🏆 Conquista: ${a.nome}! +${formatNum(a.reward)}`); }
    }
  });
}

// ===== SAVE/LOAD + OFFLINE =====

  localStorage.setItem('clickerInfinity', JSON.stringify(game));
  let ranking = JSON.parse(localStorage.getItem('clickerRanking') || '[]');

  ranking = ranking.sort((a,b)=>b.score-a.score).slice(0,20);
  localStorage.setItem('clickerRanking', JSON.stringify(ranking));
}
