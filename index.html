<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clicker Ultra 500+</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  #left { width: 20%; background: #121220; border-right: 2px solid #222; padding: 15px; overflow-y: auto; }
  #center { width: 40%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  #right { width: 20%; background: #121220; border-left: 2px solid #222; padding: 15px; overflow-y: auto; }
  #farRight { width: 20%; background: #0f0f1a; padding: 15px; overflow-y: auto; border-left: 2px solid #222; }

  #score { font-size: 3rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 15px #ffd700; }
  #pps { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; }

  #botao {
    width: 270px; height: 270px; border-radius: 50%;
    background: radial-gradient(circle, #ff4d6d, #c9184a);
    border: 6px solid #ff758f;
    font-size: 2.2rem; font-weight: bold; color: white;
    cursor: pointer; transition: all 0.08s;
    box-shadow: 0 0 40px rgba(255,77,109,0.6);
    position: relative;
  }
  #botao:active { transform: scale(0.85); }

 .upgrade,.mission,.achievement,.skin,.event {
    background: #1e1e35;
    padding: 10px; margin: 6px 0; border-radius: 8px;
    cursor: pointer; border: 1px solid #333;
    transition: 0.2s;
  }
 .upgrade:hover,.mission:hover,.skin:hover { background: #282850; transform: translateX(4px); }
 .upgrade.locked,.skin.locked { opacity: 0.4; cursor: not-allowed; }
 .cost { color: #4cc9f0; font-weight: bold; }
 .owned { color: #90e0ef; font-size: 0.8rem; float: right; }
 .done { opacity: 0.4; }

  #prestigeBtn, #settingsBtn {
    margin-top: 10px; padding: 10px; width: 100%;
    background: linear-gradient(90deg, #7209b7, #560bad);
    border: none; border-radius: 8px; color: white; font-weight: bold;
    cursor: pointer;
  }
  #prestigeBtn:disabled { opacity: 0.3; cursor: not-allowed; }

 .float { position: absolute; color: #ffd700; font-weight: bold; animation: floatUp 1s forwards; pointer-events: none; font-size: 1.3rem; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-130px) scale(1.6); } }

  #boss { position: absolute; top: 10%; width: 120px; height: 120px; background: radial-gradient(#ff0000,#800000); border-radius: 20px; display: none; cursor: pointer; animation: bossFloat 2s infinite; }
  @keyframes bossFloat { 0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)} }
  #bossHp { position: absolute; top: -20px; width: 100%; height: 8px; background: #333; border-radius: 4px; }
  #bossHpBar { height: 100%; background: #ff0000; border-radius: 4px; transition: width 0.2s; }

  h2 { margin-bottom: 8px; color: #f72585; font-size: 1.1rem; border-bottom: 2px solid #f72585; padding-bottom: 4px; }
  #multiplier, #crit, #eventTimer { margin-top: 8px; color: #90e0ef; }
 .event { background: linear-gradient(90deg,#ff9f1c,#ffbf69); color: #000; font-weight: bold; }
</style>
</head>
<body>

<div id="left">
  <h2>Upgrades PPS</h2>
  <div id="upgradesPPS"></div>
  <h2>Upgrades Clique</h2>
  <div id="upgradesClick"></div>
  <button id="prestigeBtn" onclick="prestige()">PRESTÍGIO <span id="prestigeReward">0</span>✨</button>
  <button id="settingsBtn" onclick="resetSave()">Resetar Save</button>
</div>

<div id="center">
  <div id="score">0</div>
  <div id="pps">0.0/s</div>
  <button id="botao" onclick="clickBtn(event)">CLICA</button>
  <div id="boss" onclick="hitBoss(event)"><div id="bossHp"><div id="bossHpBar"></div></div></div>
  <div id="multiplier">Multiplicador: x1.00</div>
  <div id="crit">Crítico: 5.0%</div>
  <div id="eventTimer"></div>
</div>

<div id="right">
  <h2>Missões</h2>
  <div id="missions"></div>
  <h2>Conquistas</h2>
  <div id="achievements"></div>
</div>

<div id="farRight">
  <h2>Loja de Skins</h2>
  <div id="skins"></div>
  <h2>Ranking</h2>
  <div id="ranking"></div>
  <h2>Estatísticas</h2>
  <div id="stats"></div>
</div>

<audio id="clickSound" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="></audio>

<script>
let game = {
  pontos: 0, pontosPorClique: 1, pontosPorSegundo: 0, multiplicador: 1, critChance: 0.05,
  totalClicado: 0, prestigio: 0, tempoJogado: 0, skinEquipada: 'default',
  upgrades: [
    { id: 'cursor', nome: 'Cursor', baseCost: 15, cost: 15, owned: 0, pps: 0.1, desc: '+0.1/s' },
    { id: 'fazenda', nome: 'Fazenda', baseCost: 100, cost: 100, owned: 0, pps: 1, desc: '+1/s' },
    { id: 'mina', nome: 'Mina', baseCost: 500, cost: 500, owned: 0, pps: 4, desc: '+4/s' },
    { id: 'fabrica', nome: 'Fábrica', baseCost: 1100, cost: 1100, owned: 0, pps: 8, desc: '+8/s' },
    { id: 'banco', nome: 'Banco', baseCost: 12000, cost: 12000, owned: 0, pps: 47, desc: '+47/s' },
    { id: 'laboratorio', nome: 'Laboratório', baseCost: 50000, cost: 50000, owned: 0, pps: 110, desc: '+110/s' },
    { id: 'portal', nome: 'Portal', baseCost: 130000, cost: 130000, owned: 0, pps: 260, desc: '+260/s' },
    { id: 'nave', nome: 'Nave Espacial', baseCost: 500000, cost: 500000, owned: 0, pps: 1000, desc: '+1000/s' }
  ],
  upgradesClique: [
    { id: 'dedo', nome: 'Dedo Forte', baseCost: 50, cost: 50, owned: 0, cpp: 1, desc: '+1 por clique' },
    { id: 'luva', nome: 'Luva de Aço', baseCost: 500, cost: 500, owned: 0, cpp: 5, desc: '+5 por clique' },
    { id: 'martelo', nome: 'Martelo', baseCost: 3000, cost: 3000, owned: 0, cpp: 20, desc: '+20 por clique' },
    { id: 'broca', nome: 'Broca', baseCost: 10000, cost: 10000, owned: 0, cpp: 50, desc: '+50 por clique' },
    { id: 'crit', nome: 'Crítico', baseCost: 2000, cost: 2000, owned: 0, crit: 0.05, desc: '+5% chance crítico x3' },
    { id: 'ultra', nome: 'Ultra Click', baseCost: 25000, cost: 25000, owned: 0, crit: 0.1, desc: '+10% crítico' }
  ],
  missions: [
    { id: 1, nome: 'Primeiros 100', req: 100, reward: 50, done: false },
    { id: 2, nome: '1000 cliques', req: 1000, type: 'clicks', reward: 200, done: false },
    { id: 3, nome: 'Rico', req: 10000, reward: 1000, done: false },
    { id: 4, nome: 'Imparável', req: 100000, reward: 10000, done: false },
    { id: 5, nome: 'Deus do Clique', req: 1000000, reward: 100000, done: false }
  ],
  achievements: [
    { id: 1, nome: 'Iniciante', desc: 'Faça 100 cliques', req: 100, type: 'clicks', done: false },
    { id: 2, nome: 'Colecionador', desc: 'Compre 10 upgrades', req: 10, type: 'upgrades', done: false },
    { id: 3, nome: 'Ascendido', desc: 'Alcance 1 Prestígio', req: 1, type: 'prest', done: false },
    { id: 4, nome: 'Matador de Boss', desc: 'Derrote 5 bosses', req: 5, type: 'boss', done: false }
  ],
  skins: [
    { id: 'default', nome: 'Padrão', cost: 0, owned: true, color: 'radial-gradient(circle, #ff4d6d, #c9184a)' },
    { id: 'gold', nome: 'Dourada', cost: 5000, owned: false, color: 'radial-gradient(circle, #ffd700, #ffb700)' },
    { id: 'ice', nome: 'Gelo', cost: 20000, owned: false, color: 'radial-gradient(circle, #90e0ef, #00b4d8)' },
    { id: 'neon', nome: 'Neon', cost: 100000, owned: false, color: 'radial-gradient(circle, #ff00ff, #00ffff)' }
  ],
  boss: { active: false, hp: 0, maxHp: 0, kills: 0 },
  event: { active: false, type: null, timer: 0 }
};

function clickBtn(e) {
  let ganho = game.pontosPorClique * game.multiplicador * (1 + game.prestigio * 0.1);
  if(game.event.active && game.event.type === '2x') ganho *= 2;
  let isCrit = Math.random() < game.critChance;
  if(isCrit) ganho *= 3;
  game.pontos += ganho; game.totalClicado += 1;
  showFloat(e.clientX, e.clientY, `+${Math.floor(ganho)}${isCrit? ' CRIT!' : ''}`);
  playSound(); update();
}

function showFloat(x, y, text) {
  let el = document.createElement('div'); el.className = 'float';
  el.style.left = (x - 50) + 'px'; el.style.top = (y - 30) + 'px'; el.innerText = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
}

function playSound() {
  let audio = document.getElementById('clickSound');
  audio.currentTime = 0; audio.play().catch(()=>{});
}

function buyUpgrade(type, index) {
  let upg = type === 'pps'? game.upgrades[index] : game.upgradesClique[index];
  if(game.pontos >= upg.cost) {
    game.pontos -= upg.cost; upg.owned += 1;
    upg.cost = Math.floor(upg.baseCost * Math.pow(1.15, upg.owned));
    if(type === 'pps') game.pontosPorSegundo += upg.pps;
    if(type === 'cpp') game.pontosPorClique += upg.cpp;
    if(type === 'crit') game.critChance += upg.crit;
    update();
  }
}

function buySkin(index) {
  let skin = game.skins[index];
  if(!skin.owned && game.pontos >= skin.cost) {
    game.pontos -= skin.cost; skin.owned = true;
  }
  if(skin.owned) {
    game.skinEquipada = skin.id;
    document.getElementById('botao').style.background = skin.color;
  }
  update();
}

function prestige() {
  if(game.pontos < 100000) return;
  let reward = Math.floor(Math.sqrt(game.pontos / 100000));
  if(confirm(`Resetar e ganhar ${reward}✨ de prestígio? +${(reward*10)}% permanente`)){
    game.prestigio += reward; game.pontos = 0; game.pontosPorClique = 1; game.pontosPorSegundo = 0;
    game.critChance = 0.05; game.totalClicado = 0;
    game.upgrades.forEach(u => { u.owned = 0; u.cost = u.baseCost; });
    game.upgradesClique.forEach(u => { u.owned = 0; u.cost = u.baseCost; });
    update();
  }
}

function spawnBoss() {
  if(game.boss.active) return;
  game.boss.active = true;
  game.boss.maxHp = 1000 * (1 + game.prestigio);
  game.boss.hp = game.boss.maxHp;
  document.getElementById('boss').style.display = 'block';
  updateBossBar();
  setTimeout(() => { if(game.boss.active) despawnBoss(); }, 15000);
}

function hitBoss(e) {
  if(!game.boss.active) return;
  let dmg = game.pontosPorClique * 10;
  game.boss.hp -= dmg;
  showFloat(e.clientX, e.clientY, `-${Math.floor(dmg)}`);
  updateBossBar();
  if(game.boss.hp <= 0) {
    game.boss.kills += 1; game.pontos += game.boss.maxHp * 0.5;
    alert(`Boss derrotado! +${Math.floor(game.boss.maxHp * 0.5)} pontos`);
    despawnBoss();
  }
}

function despawnBoss() {
  game.boss.active = false;
  document.getElementById('boss').style.display = 'none';
}

function updateBossBar() {
  let pct = (game.boss.hp / game.boss.maxHp) * 100;
  document.getElementById('bossHpBar').style.width = pct + '%';
}

function triggerEvent() {
  if(game.event.active) return;
  game.event.active = true;
  game.event.type = '2x';
  game.event.timer = 30;
  let el = document.createElement('div'); el.className = 'event'; el.innerText = 'EVENTO: 2x PONTOS POR 30s!';
  document.getElementById('eventTimer').appendChild(el);
}

function updateEvent() {
  if(game.event.active) {
    game.event.timer -= 1;
    document.getElementById('eventTimer').innerText = `Evento: ${game.event.timer}s`;
    if(game.event.timer <= 0) {
      game.event.active = false; game.event.type = null;
      document.getElementById('eventTimer').innerHTML = '';
    }
  }
}

function checkMissions() {
  game.missions.forEach(m => {
    if(!m.done) {
      let progress = m.type === 'clicks'? game.totalClicado : game.pontos;
      if(progress >= m.req) { m.done = true; game.pontos += m.reward; alert(`Missão: ${m.nome}! +${m.reward}`); }
    }
  });
}

function checkAchievements() {
  let totalUpgrades = [...game.upgrades,...game.upgradesClique].reduce((a,u)=>a+u.owned,0);
  game.achievements.forEach(a => {
    if(!a.done) {
      let progress = a.type==='clicks'?game.totalClicado:a.type==='upgrades'?totalUpgrades:a.type==='prest'?game.prestigio:a.type==='boss'?game.boss.kills:0;
      if(progress >= a.req) { a.done = true; game.pontos += 500; alert(`Conquista: ${a.nome}!`); }
    }
  });
}

function update() {
  document.getElementById('score').innerText = Math.floor(game.pontos).toLocaleString('pt-BR');
  let ppsTotal = game.pontosPorSegundo * (1 + game.prestigio * 0.1);
  if(game.event.active && game.event.type === '2x') ppsTotal *= 2;
  document.getElementById('pps').innerText = `${ppsTotal.toFixed(1)}/s`;
  document.getElementById('multiplier').innerText = `Multiplicador: x${(1 + game.prestigio * 0.1).toFixed(2)}`;
  document.getElementById('crit').innerText = `Crítico: ${(game.critChance*100).toFixed(1)}%`;
  document.getElementById('prestigeReward').innerText = Math.floor(Math.sqrt(game.pontos / 100000));
  document.getElementById('prestigeBtn').disabled = game.pontos < 100000;
  renderUpgrades(); renderMissions(); renderAchievements(); renderSkins(); renderStats(); renderRanking();
  checkMissions(); checkAchievements(); saveGame();
}

function renderUpgrades() {
  let htmlPPS = ''; game.upgrades.forEach((u,i) => {
    htmlPPS += `<div class="upgrade ${game.pontos < u.cost? 'locked' : ''}" onclick="buyUpgrade('pps', ${i})">
      <b>${u.nome}</b><span class="owned">${u.owned}</span><br><span>${u.desc}</span><br>
      <span class="cost">${u.cost.toLocaleString('pt-BR')}</span></div>`;
  });
  let htmlClick = ''; game.upgradesClique.forEach((u,i) => {
    htmlClick += `<div class="upgrade ${game.pontos < u.cost? 'locked' : ''}" onclick="buyUpgrade('cpp', ${i})">
      <b>${u.nome}</b><span class="owned">${u.owned}</span><br><span>${u.desc}</span><br>
      <span class="cost">${u.cost.toLocaleString('pt-BR')}</span></div>`;
  });
  document.getElementById('upgradesPPS').innerHTML = htmlPPS;
  document.getElementById('upgradesClick').innerHTML = htmlClick;
}

function renderMissions() {
  let html = ''; game.missions.forEach(m => {
    html += `<div class="mission ${m.done?'done':''}"><b>${m.nome}</b> ${m.done?'✅':''}<br>
      Recompensa: <span class="cost">${m.reward.toLocaleString('pt-BR')}</span></div>`;
  });
  document.getElementById('missions').innerHTML = html;
}

function renderAchievements() {
  let html = ''; game.achievements.forEach(a => {
    html += `<div class="achievement ${a.done?'done':''}"><b>${a.nome}</b> ${a.done?'🏆':''}<br>${a.desc}</div>`;
  });
  document.getElementById('achievements').innerHTML = html;
}

function renderSkins() {
  let html = ''; game.skins.forEach((s,i) => {
    html += `<div class="skin ${!s.owned && game.pontos < s.cost?'locked':''}" onclick="buySkin(${i})">
      <b>${s.nome}</b> ${game.skinEquipada===s.id?'✔️':''}<br>
      <span class="cost">${s.owned?'Equipado':s.cost===0?'Grátis':s.cost.toLocaleString('pt-BR')}</span></div>`;
  });
  document.getElementById('skins').innerHTML = html;
}

function renderStats() {
  let totalUpgrades = [...game.upgrades,...game.upgradesClique].reduce((a,u)=>a+u.owned,0);
  document.getElementById('stats').innerHTML = `
    Total clicado: ${game.totalClicado.toLocaleString('pt-BR')}<br>
    Prestígio: ${game.prestigio}✨<br>
    Bosses: ${game.boss.kills}<br>
    Upgrades: ${totalUpgrades}<br>
    Tempo: ${Math.floor(game.tempoJogado/60)}min
  `;
}

function renderRanking() {
  let ranking = JSON.parse(localStorage.getItem('clickerRanking') || '[]');
  ranking.sort((a,b)=>b.score-a.score);
  let html = ''; ranking.slice(0,5).forEach((r,i)=>html+=`${i+1}. ${r.score.toLocaleString('pt-BR')}<br>`);
  document.getElementById('ranking').innerHTML = html || 'Sem recordes ainda';
}

function saveGame() {
  localStorage.setItem('clickerUltra', JSON.stringify(game));
  let ranking = JSON.parse(localStorage.getItem('clickerRanking') || '[]');
  ranking.push({score: Math.floor(game.pontos), date: Date.now()});
  ranking = ranking.slice(-10);
  localStorage.setItem('clickerRanking', JSON.stringify(ranking));
}

function loadGame() {
  let save = localStorage.getItem('clickerUltra');
  if(save) game = JSON.parse(save);
  let skin = game.skins.find(s=>s.id===game.skinEquipada);
  if(skin) document.getElementById('botao').style.background = skin.color;
}

function resetSave() {
  if(confirm("Apagar tudo?")) { localStorage.removeItem('clickerUltra'); location.reload(); }
}

// Loops principais
setInterval(() => {
  game.pontos += game.pontosPorSegundo * (1 + game.prestigio * 0.1) * (game.event.active&&game.event.type==='2x'?2:1);
  game.tempoJogado += 1; updateEvent(); update();
}, 1000);

setInterval(() => { if(Math.random() < 0.02) spawnBoss(); }, 5000);
setInterval(() => { if(Math.random() < 0.01) triggerEvent(); }, 10000);

loadGame(); update();
</script>
</body>
</html>
