<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minecraft Web</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #87CEEB; overflow: hidden; font-family: Arial; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: white; font-size: 32px; text-shadow: 2px 2px 0 #000; pointer-events: none; }
  #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 10px; }
 .slot { width: 60px; height: 60px; background: #8B8B8B; border: 4px solid #373737;
    display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
 .slot.selected { border-color: white; background: #AAAAAA; }
  #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.6);
    padding: 10px; border-radius: 5px; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="crosshair">+</div>
<div id="info">WASD: Mover | Mouse: Olhar | Click: Quebrar | Shift+Click: Colocar</div>
<div id="hotbar">
  <div class="slot selected">🟩</div>
  <div class="slot">🟫</div>
  <div class="slot">⬜</div>
  <div class="slot">🪵</div>
  <div class="slot">🍃</div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// PARTE 2 VEM AÍ
// ===== CONFIG E VARIAVEIS =====
const CHUNK_SIZE = 16;
let scene, camera, renderer, raycaster;
let world = {};
let player = { x: 0, y: 15, z: 0, vx: 0, vy: 0, vz: 0, onGround: false };
let keys = {};
let mouseX = 0, mouseY = 0, yaw = 0, pitch = 0;
let selectedBlock = 1;

// ===== TEXTURAS =====
function makeTex(color) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const ctx = c.getContext('2d'); ctx.fillStyle = color; ctx.fillRect(0,0,16,16);
  ctx.strokeStyle = '#000'; ctx.strokeRect(0,0,16,16);
  const tex = new THREE.CanvasTexture(c); tex.magFilter = THREE.NearestFilter; return tex;
}
const TEXTURES = {
 1: makeTex('#4CAF50'), 2: makeTex('#8B4513'), 3: makeTex('#808080'),
  4: makeTex('#8B4513'), 5: makeTex('#228B22')
};
// ===== INICIAR JOGO =====
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 0, 150);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game') });
  renderer.setSize(window.innerWidth, window.innerHeight);

  raycaster = new THREE.Raycaster();
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const light = new THREE.DirectionalLight(0xffffff, 0.5);
  light.position.set(10, 20, 10); scene.add(light);

  generateWorld();
  setupControls();
  animate();
}
// ===== GERAR MUNDO =====
function getKey(x,y,z) { return x+','+y+','+z; }

function setBlock(x,y,z,type) {
  const key = getKey(x,y,z);
  if(world[key]) scene.remove(world[key]);
  if(type === 0) { delete world[key]; return; }

  const geo = new THREE.BoxGeometry(1,1,1);
  const mat = new THREE.MeshLambertMaterial({ map: TEXTURES[type] });
  const cube = new THREE.Mesh(geo, mat);
  cube.position.set(x, y, z);
  cube.userData = { x, y, z, type };
  scene.add(cube); world[key] = cube;
}

function generateWorld() {
  for(let x = -20; x <= 20; x++) {
    for(let z = -20; z <= 20; z++) {
      let h = Math.floor(Math.sin(x*0.2)*3 + Math.cos(z*0.2)*3 + 5);
      for(let y = 0; y <= h; y++) {
        let type = y === h? 1 : y > h-3? 2 : 3;
        setBlock(x, y, z, type);
      }
    }
  }
}
// ===== CONTROLES PC =====
function setupControls() {
  document.addEventListener('keydown', e => keys[e.code] = true);
  document.addEventListener('keyup', e => keys[e.code] = false);

  document.addEventListener('mousedown', e => {
    if(e.button === 0) breakBlock(e.shiftKey);
    if(e.button === 2) e.preventDefault();
  });

  document.getElementById('game').onclick = () => {
    document.getElementById('game').requestPointerLock();
  }

  document.addEventListener('mousemove', e => {
    if(document.pointerLockElement === document.getElementById('game')) {
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-1.5, Math.min(1.5, pitch));
    }
  });

  document.querySelectorAll('.slot').forEach((s,i) => {
    s.onclick = () => {
      document.querySelector('.selected').classList.remove('selected');
      s.classList.add('selected'); selectedBlock = i+1;
    }
  });
}
// ===== QUEBRAR E COLOCAR =====
function breakBlock(isShift) {
  const dir = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(1,0,0), pitch).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  raycaster.set(camera.position, dir);
  const hits = raycaster.intersectObjects(scene.children);
  if(hits[0] && hits[0].distance < 6) {
    const b = hits[0].object.userData;
    if(isShift) {
      const n = hits[0].face.normal;
      setBlock(b.x+n.x, b.y+n.y, b.z+n.z, selectedBlock);
    } else {
      setBlock(b.x, b.y, b.z, 0);
    }
  }
}
// ===== FISICA DO PLAYER =====
function updatePlayer() {
  const speed = 0.2;
  let forward = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  let right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  if(keys['KeyW']) { player.x += forward.x * speed; player.z += forward.z * speed; }
  if(keys['KeyS']) { player.x -= forward.x * speed; player.z -= forward.z * speed; }
  if(keys['KeyA']) { player.x += right.x * speed; player.z += right.z * speed; }
  if(keys['KeyD']) { player.x -= right.x * speed; player.z -= right.z * speed; }
  if(keys['Space'] && player.onGround) { player.vy = 0.25; player.onGround = false; }

  player.vy -= 0.01; // gravidade
  player.y += player.vy;

  if(player.y < 6) { player.y = 6; player.vy = 0; player.onGround = true; }

  camera.position.set(player.x, player.y, player.z);
  camera.rotation.set(pitch, yaw, 0);
}
// ===== LOOP PRINCIPAL =====
function animate() {
  requestAnimationFrame(animate);
  updatePlayer();
  renderer.render(scene, camera);
}

init();
// ===== AJUSTE TELA =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== ANTI MENU CONTEXTO =====
document.addEventListener('contextmenu', e => e.preventDefault());
// FIM DO CODIGO - SALVE E ABRA
</script>
</body>
</html>
